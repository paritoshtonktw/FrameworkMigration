name: Deploy to AWS

on:
  push:
    branches:
      - feat/aws
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Build and Deploy the React Frontend to AWS S3 & CloudFront
  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'Crypto Trader React/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: './Crypto Trader React'
        run: npm ci

      - name: Build Frontend
        working-directory: './Crypto Trader React'
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.AWS_API_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync "./Crypto Trader React/build" "s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }}" --delete

      - name: Invalidate CloudFront Cache
        if: "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}"
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  # Job 2: Build and Deploy the Legacy .NET Framework Web API to AWS Elastic Beanstalk
  deploy-backend:
    name: Deploy Legacy .NET API
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore "Crypto Trading/Crypto Trading.sln"

      - name: Build Legacy ASP.NET Web API (Publish Package)
        run: |
          msbuild "Crypto Trading/Crypto Trading/Crypto Trading.csproj" /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:PackageLocation="${{ github.workspace }}\deploy-package.zip"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Package to S3 Source Bundle
        run: |
          aws s3 cp "${{ github.workspace }}\deploy-package.zip" "s3://${{ secrets.AWS_EB_SOURCE_BUNDLE_BUCKET }}/backend-versions/${{ github.sha }}.zip"

      - name: Create Beanstalk App Version & Update Environment
        shell: bash
        run: |
          VERSION_LABEL="deploy-${{ github.sha }}"
          
          # Create new application version
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.AWS_EB_APPLICATION_NAME }}" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="${{ secrets.AWS_EB_SOURCE_BUNDLE_BUCKET }}",S3Key="backend-versions/${{ github.sha }}.zip" \
            --auto-create-application
          
          # Deploy version to Elastic Beanstalk Environment
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.AWS_EB_ENVIRONMENT_NAME }}" \
            --version-label "$VERSION_LABEL"

  # Job 3: Initialize/Migrate the SQL Server Database on AWS RDS
  deploy-database:
    name: Deploy RDS SQL Database
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Schema and Seed Scripts on RDS SQL Server
        shell: powershell
        run: |
          $rdsHost = "${{ secrets.RDS_HOST }}"
          $rdsUser = "${{ secrets.RDS_USER }}"
          $rdsPass = "${{ secrets.RDS_PASSWORD }}"
          
          if ([string]::IsNullOrEmpty($rdsHost) -or [string]::IsNullOrEmpty($rdsUser) -or [string]::IsNullOrEmpty($rdsPass)) {
              Write-Warning "RDS connection details are incomplete. Skipping database deployment step."
              exit 0
          }
          
          # Execute the master initialization script using native sqlcmd (included on windows-latest runner)
          sqlcmd -S "$rdsHost" -U "$rdsUser" -P "$rdsPass" -i "database/scripts/RunAll.sql" -C
