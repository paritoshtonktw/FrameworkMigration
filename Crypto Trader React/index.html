<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrader — React Frontend</title>
    <!-- React 18 & ReactDOM via CDN for immediate execution without Node.js -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const LEGACY_URL = 'http://localhost:44341/api';
        const UPLIFTED_URL = 'http://localhost:5152/api';

        const getEnvValue = () => {
            if (typeof process !== 'undefined' && process.env) {
                return (
                    process.env.REACT_APP_BACKEND ||
                    process.env.REACT_APP_ENV ||
                    process.env.REACT_APP_BACKEND_ENV ||
                    process.env.REACT_APP_ACTIVE_BACKEND ||
                    ''
                ).toLowerCase();
            }
            if (typeof window !== 'undefined') {
                if (window.process && window.process.env) {
                    return (
                        window.process.env.REACT_APP_BACKEND ||
                        window.process.env.REACT_APP_ENV ||
                        window.process.env.REACT_APP_BACKEND_ENV ||
                        window.process.env.REACT_APP_ACTIVE_BACKEND ||
                        ''
                    ).toLowerCase();
                }
                if (window.ENV) {
                    return (
                        window.ENV.REACT_APP_BACKEND ||
                        window.ENV.REACT_APP_ENV ||
                        window.ENV.REACT_APP_BACKEND_ENV ||
                        window.ENV.REACT_APP_ACTIVE_BACKEND ||
                        ''
                    ).toLowerCase();
                }
            }
            return '';
        };

        const getQueryValue = () => {
            if (typeof window !== 'undefined' && window.location) {
                const urlParams = new URLSearchParams(window.location.search);
                return (urlParams.get('backend') || urlParams.get('env') || '').toLowerCase();
            }
            return '';
        };

        const envVal = getEnvValue() || getQueryValue();
        const isLegacy = envVal.includes('legacy') || (typeof process !== 'undefined' && process.env && process.env.REACT_APP_API_BASE_URL && process.env.REACT_APP_API_BASE_URL.includes('44341'));

        const API_BASE = isLegacy ? LEGACY_URL : ((typeof process !== 'undefined' && process.env && process.env.REACT_APP_API_BASE_URL) || UPLIFTED_URL);
        const IS_LEGACY_BACKEND = isLegacy;
        const BACKEND_LABEL = IS_LEGACY_BACKEND ? 'LEGACY AS-IS' : 'UPLIFTED CORE';
        const BACKEND_LABEL_LONG = IS_LEGACY_BACKEND ? 'LEGACY AS-IS PLATFORM' : 'UPLIFTED .NET CORE PLATFORM';
        const REFRESH_INTERVAL_SECONDS = 20;
        const REFRESH_INTERVAL_MS = REFRESH_INTERVAL_SECONDS * 1000;

        function parseJwt(token) {
            if (!token || typeof token !== 'string') return null;
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            try {
                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const pad = base64.length % 4;
                const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
                const decoded = atob(padded);
                const utf8 = decodeURIComponent(
                    decoded.split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
                );
                return JSON.parse(utf8);
            } catch {
                try { return JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'))); }
                catch { return null; }
            }
        }

        function isTokenExpired(token) {
            if (!token) return true;
            const payload = parseJwt(token);
            if (!payload || !payload.exp) return false;
            return payload.exp * 1000 <= Date.now();
        }

        let sessionExpiredListeners = [];

        const authStorage = {
            getToken: () => localStorage.getItem('crypto_trader_token'),
            setToken: (t) => localStorage.setItem('crypto_trader_token', t),
            clear: () => {
                localStorage.removeItem('crypto_trader_token');
                localStorage.removeItem('crypto_trader_user');
            },
            logout: () => {
                authStorage.clear();
            },
            getUser: () => {
                try {
                    const token = authStorage.getToken();
                    if (!token || isTokenExpired(token)) {
                        authStorage.clear();
                        return null;
                    }
                    return JSON.parse(localStorage.getItem('crypto_trader_user') || 'null');
                } catch {
                    return null;
                }
            },
            setUser: (u) => localStorage.setItem('crypto_trader_user', JSON.stringify(u)),
            onSessionExpired: (listener) => {
                sessionExpiredListeners.push(listener);
                return () => {
                    sessionExpiredListeners = sessionExpiredListeners.filter(l => l !== listener);
                };
            },
            notifySessionExpired: (reason = 'expired') => {
                authStorage.clear();
                sessionExpiredListeners.forEach(l => {
                    try { l(reason); } catch (e) { console.error(e); }
                });
                window.dispatchEvent(new CustomEvent('crypto_trader:session_expired', { detail: { reason } }));
            }
        };

        async function apiCall(path, method = 'GET', body = null) {
            const token = authStorage.getToken();
            const isAuthEndpoint = path.startsWith('/auth/login') || path.startsWith('/auth/register');

            if (token) {
                if (!isAuthEndpoint && isTokenExpired(token)) {
                    authStorage.notifySessionExpired('expired');
                    const err = new Error('Your session has expired. Please sign in again.');
                    err.status = 401;
                    throw err;
                }
            }

            const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(`${API_BASE}${path}`, {
                cache: 'no-store',
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });

            if (res.status === 401 && !isAuthEndpoint) {
                authStorage.notifySessionExpired('unauthorized');
                let errJson = null;
                try { errJson = await res.json(); } catch {}
                const msg = errJson?.message || 'Your session has expired. Please sign in again.';
                const err = new Error(msg);
                err.status = 401;
                throw err;
            }

            const json = await res.json();
            if (!res.ok || !json.success) {
                throw new Error(json.message || `API call failed: ${res.status}`);
            }
            return json.data;
        }

        function safeNum(val, fallback = 0) {
            if (val === null || val === undefined) return fallback;
            const n = typeof val === 'number' ? val : parseFloat(val);
            return isNaN(n) ? fallback : n;
        }

        function fmtMoney(val, minDec = 2, maxDec = undefined) {
            const n = safeNum(val);
            let min = typeof minDec === 'number' && !isNaN(minDec) ? Math.max(0, Math.min(20, Math.floor(minDec))) : 2;
            let max = typeof maxDec === 'number' && !isNaN(maxDec) ? Math.max(0, Math.min(20, Math.floor(maxDec))) : Math.max(min, 2);
            if (max < min) max = min;
            try {
                return n.toLocaleString('en-US', { minimumFractionDigits: min, maximumFractionDigits: max });
            } catch {
                return n.toFixed(Math.min(min, 8));
            }
        }

        async function downloadPnLReport(timeframe = '30d') {
            const token = authStorage.getToken();
            if (token && isTokenExpired(token)) {
                authStorage.notifySessionExpired('expired');
                throw new Error('Your session has expired. Please sign in again.');
            }
            const res = await fetch(`${API_BASE}/portfolio/reports/pnl-settlement?timeframe=${encodeURIComponent(timeframe)}`, {
                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
            });
            if (res.status === 401) {
                authStorage.notifySessionExpired('unauthorized');
                throw new Error('Your session has expired. Please sign in again.');
            }
            if (!res.ok) throw new Error(`Report generation failed (${res.status})`);
            const blob = await res.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `Crypto_PnL_Settlement_Report_${timeframe}_${new Date().toISOString().slice(0, 10)}.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => window.URL.revokeObjectURL(blobUrl), 1000);
        }

        function App() {
            const [user, setUser] = React.useState(() => authStorage.getUser());
            const [authMode, setAuthMode] = React.useState('login');
            const [sessionExpiredMsg, setSessionExpiredMsg] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedSymbol, setSelectedSymbol] = React.useState('BTC');
            const [portfolio, setPortfolio] = React.useState(null);
            const [cryptos, setCryptos] = React.useState([]);
            const [lastMarketUpdate, setLastMarketUpdate] = React.useState(null);
            const [isRefreshingMarket, setIsRefreshingMarket] = React.useState(false);
            const [countdown, setCountdown] = React.useState(REFRESH_INTERVAL_SECONDS);
            const [backendOffline, setBackendOffline] = React.useState(false);

            // Load market data
            const loadMarket = React.useCallback(async (force = false) => {
                setIsRefreshingMarket(true);
                try {
                    const data = await apiCall(`/cryptocurrencies${force ? '?force=true' : ''}`);
                    setCryptos(data || []);
                    setLastMarketUpdate(new Date());
                    setBackendOffline(false);
                } catch (e) {
                    console.error('Market error:', e);
                    setBackendOffline(true);
                } finally {
                    setIsRefreshingMarket(false);
                    setCountdown(REFRESH_INTERVAL_SECONDS);
                }
            }, []);

            // Load user portfolio
            const loadPortfolio = React.useCallback(async () => {
                if (!authStorage.getToken()) return;
                try {
                    const data = await apiCall('/portfolio');
                    setPortfolio(data);
                    setBackendOffline(false);
                } catch (e) {
                    console.error('Portfolio error:', e);
                }
            }, []);

            const refreshMarket = React.useCallback(async (force = false) => {
                await loadMarket(force);
                if (authStorage.getToken()) {
                    await loadPortfolio();
                }
            }, [loadMarket, loadPortfolio]);

            React.useEffect(() => {
                loadMarket();
            }, [loadMarket]);

            React.useEffect(() => {
                const timer = setInterval(() => {
                    setCountdown(prev => {
                        if (prev <= 1) {
                            loadMarket();
                            if (authStorage.getToken()) {
                                loadPortfolio();
                            }
                            return REFRESH_INTERVAL_SECONDS;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [loadMarket, loadPortfolio]);

            React.useEffect(() => {
                if (user) {
                    loadPortfolio();
                    const pTimer = setInterval(loadPortfolio, REFRESH_INTERVAL_MS);
                    return () => clearInterval(pTimer);
                } else {
                    setPortfolio(null);
                }
            }, [user, loadPortfolio]);

            const handleTradeCrypto = (symbol) => {
                setSelectedSymbol(symbol || 'BTC');
                setActiveTab('trading');
            };

            const handleLogin = (u) => {
                setSessionExpiredMsg('');
                setUser(u);
                setActiveTab('dashboard');
            };

            const handleLogout = React.useCallback((reason = null) => {
                authStorage.clear();
                setUser(null);
                setPortfolio(null);
                setAuthMode('login');
                if (reason) {
                    setSessionExpiredMsg('Your session has expired. Please sign in again.');
                } else {
                    setSessionExpiredMsg('');
                }
            }, []);

            React.useEffect(() => {
                const unsubscribe = authStorage.onSessionExpired((reason) => {
                    handleLogout(reason || 'expired');
                });
                const handleCustomEvent = (e) => {
                    handleLogout(e?.detail?.reason || 'expired');
                };
                window.addEventListener('crypto_trader:session_expired', handleCustomEvent);
                return () => {
                    if (unsubscribe) unsubscribe();
                    window.removeEventListener('crypto_trader:session_expired', handleCustomEvent);
                };
            }, [handleLogout]);

            React.useEffect(() => {
                if (!user) return;
                const checkExpiry = () => {
                    const token = authStorage.getToken();
                    if (!token || isTokenExpired(token)) {
                        handleLogout('expired');
                    }
                };
                checkExpiry();
                const interval = setInterval(checkExpiry, 5000);
                return () => clearInterval(interval);
            }, [user, handleLogout]);

            if (!user) {
                return (
                    <div className="auth-wrapper">
                        <div className="auth-container">
                            <div className="auth-brand">
                                <span className="brand-logo">⚡</span>
                                <h1>CryptoTrader</h1>
                                <span className={IS_LEGACY_BACKEND ? "badge-legacy" : "badge-uplifted"}>
                                    {BACKEND_LABEL_LONG}
                                </span>
                            </div>
                            {authMode === 'login' ? (
                                <LoginView
                                    onLogin={handleLogin}
                                    onSwitch={() => {
                                        setSessionExpiredMsg('');
                                        setAuthMode('register');
                                    }}
                                    sessionExpiredMessage={sessionExpiredMsg}
                                />
                            ) : (
                                <RegisterView
                                    onRegister={handleLogin}
                                    onSwitch={() => {
                                        setSessionExpiredMsg('');
                                        setAuthMode('login');
                                    }}
                                />
                            )}
                        </div>
                    </div>
                );
            }

            const pSummary = portfolio?.summary || portfolio || {};
            const cash = fmtMoney(pSummary.cashBalance ?? portfolio?.cashBalance);
            const netWorth = fmtMoney(pSummary.totalPortfolioValue ?? portfolio?.totalPortfolioValue);

            return (
                <div className="app-container">
                    <header className="navbar">
                        <div className="navbar-brand">
                            <span className="logo-icon">⚡</span>
                            <span className="brand-title">CryptoTrader</span>
                            <span className={IS_LEGACY_BACKEND ? "badge-legacy" : "badge-uplifted"}>
                                {BACKEND_LABEL}
                            </span>
                        </div>

                        <nav className="navbar-nav">
                            {['dashboard', 'trading', 'portfolio', 'orders', 'trades', 'ledger', 'funds', 'profile'].map(tab => (
                                <button
                                    key={tab}
                                    className={`nav-btn ${activeTab === tab ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab)}
                                >
                                    {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                </button>
                            ))}
                        </nav>

                        <div className="navbar-user">
                            <div className="user-balances">
                                <span className="balance-item"><small>Cash:</small> <strong>${cash}</strong></span>
                                <span className="balance-item"><small>Net Worth:</small> <strong className="highlight">${netWorth}</strong></span>
                            </div>
                            <div className="user-profile-badge">
                                <span className="user-name">👤 {user.username}</span>
                                <button className="btn-logout" onClick={handleLogout}>Sign Out</button>
                            </div>
                        </div>
                    </header>

                    <main className="main-content">
                        {activeTab === 'dashboard' && <DashboardView cryptos={cryptos} portfolio={portfolio} setActiveTab={setActiveTab} lastUpdated={lastMarketUpdate} isRefreshing={isRefreshingMarket} countdown={countdown} backendOffline={backendOffline} onRefreshMarket={() => refreshMarket(true)} onTradeCrypto={handleTradeCrypto} />}
                        {activeTab === 'trading' && <TradingView cryptos={cryptos} portfolio={portfolio} selectedSymbol={selectedSymbol} onSelectSymbol={setSelectedSymbol} lastUpdated={lastMarketUpdate} isRefreshing={isRefreshingMarket} countdown={countdown} backendOffline={backendOffline} onRefreshMarket={() => refreshMarket(true)} onRefresh={() => { loadPortfolio(); loadMarket(true); }} />}
                        {activeTab === 'portfolio' && <PortfolioView portfolio={portfolio} setActiveTab={setActiveTab} lastUpdated={lastMarketUpdate} isRefreshing={isRefreshingMarket} onRefresh={() => refreshMarket(true)} onTradeCrypto={handleTradeCrypto} />}
                        {activeTab === 'orders' && <OrdersView onRefresh={loadPortfolio} />}
                        {activeTab === 'trades' && <TradesView />}
                        {activeTab === 'ledger' && <LedgerView />}
                        {activeTab === 'funds' && <FundsView portfolio={portfolio} onRefresh={loadPortfolio} />}
                        {activeTab === 'profile' && <ProfileView user={user} onUpdate={(u) => { setUser(prev => ({...prev, ...u})); authStorage.setUser({...user, ...u}); }} />}
                    </main>
                </div>
            );
        }

        function LoginView({ onLogin, onSwitch, sessionExpiredMessage }) {
            const [loginField, setLoginField] = React.useState('demo_trader');
            const [password, setPassword] = React.useState('Password123!');
            const [err, setErr] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setErr('');
                setLoading(true);
                try {
                    const res = await apiCall('/auth/login', 'POST', { usernameOrEmail: loginField, password });
                    authStorage.setToken(res.token);
                    authStorage.setUser(res.user);
                    onLogin(res.user);
                } catch (ex) {
                    setErr(ex.message || 'Login failed.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-card">
                    <div className="auth-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to your paper-trading account</p>
                    </div>
                    {sessionExpiredMessage && (
                        <div className="alert alert-error" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '1rem' }}>
                            <span>⚠️</span>
                            <span>{sessionExpiredMessage}</span>
                        </div>
                    )}
                    {err && <div className="alert alert-error">{err}</div>}
                    <form onSubmit={submit} className="auth-form">
                        <div className="form-group">
                            <label>Username or Email</label>
                            <input value={loginField} onChange={e => setLoginField(e.target.value)} required />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required />
                        </div>
                        <button type="submit" className="btn btn-primary btn-block" disabled={loading}>
                            {loading ? 'Authenticating...' : 'Sign In'}
                        </button>
                    </form>
                    <div className="demo-accounts-box">
                        <div className="demo-title">Quick Demo Logins:</div>
                        <div className="demo-buttons">
                            <button type="button" className="btn-demo" onClick={() => setLoginField('demo_trader')}>demo_trader</button>
                            <button type="button" className="btn-demo" onClick={() => setLoginField('trader1')}>trader1</button>
                            <button type="button" className="btn-demo" onClick={() => setLoginField('trader2')}>trader2</button>
                        </div>
                    </div>
                    <div className="auth-footer">
                        Need an account? <button type="button" className="link-btn" onClick={onSwitch}>Register</button>
                    </div>
                </div>
            );
        }

        function RegisterView({ onRegister, onSwitch }) {
            const [form, setForm] = React.useState({ username: '', email: '', password: '', firstName: '', lastName: '' });
            const [err, setErr] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setErr('');
                setLoading(true);
                try {
                    const res = await apiCall('/auth/register', 'POST', form);
                    authStorage.setToken(res.token);
                    authStorage.setUser(res.user);
                    onRegister(res.user);
                } catch (ex) {
                    setErr(ex.message || 'Registration failed.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-card">
                    <div className="auth-header">
                        <h2>Create Account</h2>
                        <p>Claim $10,000.00 paper trading cash</p>
                    </div>
                    {err && <div className="alert alert-error">{err}</div>}
                    <form onSubmit={submit} className="auth-form">
                        <div className="form-row">
                            <div className="form-group">
                                <label>First Name</label>
                                <input value={form.firstName} onChange={e => setForm({...form, firstName: e.target.value})} required />
                            </div>
                            <div className="form-group">
                                <label>Last Name</label>
                                <input value={form.lastName} onChange={e => setForm({...form, lastName: e.target.value})} required />
                            </div>
                        </div>
                        <div className="form-group">
                            <label>Username</label>
                            <input value={form.username} onChange={e => setForm({...form, username: e.target.value})} required />
                        </div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} required />
                        </div>
                        <div className="form-group">
                            <label>Password</label>
                            <input type="password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} minLength={6} required />
                        </div>
                        <button type="submit" className="btn btn-primary btn-block" disabled={loading}>
                            {loading ? 'Registering...' : 'Register & Claim $10,000'}
                        </button>
                    </form>
                    <div className="auth-footer">
                        Already registered? <button type="button" className="link-btn" onClick={onSwitch}>Sign In</button>
                    </div>
                </div>
            );
        }

        function DashboardView({ cryptos, portfolio, setActiveTab, lastUpdated, isRefreshing, countdown = REFRESH_INTERVAL_SECONDS, backendOffline, onRefreshMarket, onTradeCrypto }) {
            const pSummary = portfolio?.summary || portfolio || {};
            const total = safeNum(pSummary.totalPortfolioValue ?? portfolio?.totalPortfolioValue);
            const cash = safeNum(pSummary.cashBalance ?? portfolio?.cashBalance);
            const cryptoVal = safeNum(pSummary.holdingsMarketValue ?? pSummary.cryptoHoldingsValue ?? portfolio?.cryptoHoldingsValue ?? portfolio?.holdingsMarketValue);
            const unrealized = safeNum(pSummary.unrealizedProfitLoss ?? pSummary.totalUnrealizedPnL ?? portfolio?.totalUnrealizedPnL ?? portfolio?.unrealizedProfitLoss);
            const realized = safeNum(pSummary.realizedProfitLoss ?? pSummary.totalRealizedPnL ?? portfolio?.totalRealizedPnL ?? portfolio?.realizedProfitLoss);

            const [closingHolding, setClosingHolding] = React.useState(null);
            const [isClosing, setIsClosing] = React.useState(false);
            const [feedback, setFeedback] = React.useState(null);

            const confirmClosePosition = async () => {
                if (!closingHolding) return;
                setIsClosing(true);
                try {
                    const result = await apiCall(`/portfolio/positions/${closingHolding.symbol}/close`, 'POST');
                    setFeedback({
                        type: 'success',
                        message: `Closed position of ${closingHolding.quantity} ${closingHolding.symbol} at $${fmtMoney(result?.executionPrice || closingHolding.currentPrice)}!`
                    });
                    setClosingHolding(null);
                    if (onRefreshMarket) await onRefreshMarket();
                } catch (err) {
                    setFeedback({
                        type: 'error',
                        message: err.message || `Failed to close position for ${closingHolding.symbol}.`
                    });
                } finally {
                    setIsClosing(false);
                }
            };

            return (
                <div className="dashboard-view">
                    {feedback && (
                        <div className={`alert alert-${feedback.type === 'success' ? 'success' : 'error'} mb-3`} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <span>{feedback.type === 'success' ? '✅' : '⚠️'} {feedback.message}</span>
                            <button className="btn btn-sm btn-outline" style={{ border: 'none', background: 'transparent', color: 'inherit', cursor: 'pointer' }} onClick={() => setFeedback(null)}>✕</button>
                        </div>
                    )}
                    {backendOffline && (
                        <div className="alert alert-error mb-3" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <span><strong>⚠️ Backend Unreachable:</strong> Cannot connect to <code>{API_BASE}</code>. Start the backend server to fetch live CoinGecko prices.</span>
                            {onRefreshMarket && (
                                <button className="btn btn-sm btn-outline" onClick={onRefreshMarket} style={{ marginLeft: '1rem' }}>
                                    Retry Connection
                                </button>
                            )}
                        </div>
                    )}

                    <div className="section-header">
                        <div>
                            <h3>Live Cryptocurrency Market (CoinGecko)</h3>
                            <div className="market-subtitle">
                                {lastUpdated ? (
                                    <small className="text-muted">Last updated: {lastUpdated.toLocaleTimeString()}</small>
                                ) : (
                                    <small className="text-muted">Waiting for market feed...</small>
                                )}
                            </div>
                        </div>
                        <div className="market-header-actions" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                            <span className={`live-indicator ${backendOffline ? 'offline' : ''}`}>
                                {backendOffline ? (
                                    '⚠️ OFFLINE'
                                ) : isRefreshing ? (
                                    '⏳ UPDATING...'
                                ) : (

        function CryptoChartView({ symbol = 'BTC', crypto = {}, livePrice = 0, backendOffline = false, onRefreshMarket }) {
            const [timeframe, setTimeframe] = React.useState('24h');
            const [prices, setPrices] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [hoverIndex, setHoverIndex] = React.useState(null);
            const svgRef = React.useRef(null);

            const activePrice = safeNum(livePrice || crypto.currentPrice);
            const change24h = safeNum(crypto.priceChange24h);

            const timeframes = [
                { label: '1H', value: '1h' },
                { label: '24H', value: '24h' },
                { label: '7D', value: '7d' },
                { label: '1M', value: '1m' },
                { label: '1Y', value: '1y' },
                { label: 'ALL', value: 'all' }
            ];

            const generateLocalData = (p, chg, tf) => {
                const base = safeNum(p) || 100;
                let count = 36;
                let stepMs = 40 * 60 * 1000;
                if (tf === '1h') { count = 20; stepMs = 3 * 60 * 1000; }
                else if (tf === '7d') { count = 30; stepMs = 5.6 * 60 * 60 * 1000; }
                else if (tf === '1m') { count = 30; stepMs = 24 * 60 * 60 * 1000; }
                else if (tf === '1y') { count = 52; stepMs = 7 * 24 * 60 * 60 * 1000; }
                else if (tf === 'all') { count = 60; stepMs = 30 * 24 * 60 * 60 * 1000; }

                const now = Date.now();
                const start = base / (1 + (safeNum(chg) / 100));
                const validStart = start > 0 ? start : base * 0.95;
                const pts = [];
                let seed = Math.abs(Math.floor(base * 100)) % 10000 + 1;
                const prng = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

                for (let i = 0; i < count; i++) {
                    const time = new Date(now - (count - 1 - i) * stepMs);
                    let val;
                    if (i === count - 1) {
                        val = base;
                    } else {
                        const progress = i / (count - 1);
                        const trend = validStart + (base - validStart) * progress;
                        const vol = base * (tf === '1h' ? 0.004 : tf === '24h' ? 0.015 : tf === '7d' ? 0.035 : 0.08);
                        val = Math.max(0.0001, trend + (prng() - 0.48) * vol);
                    }
                    pts.push({
                        timestamp: time.getTime(),
                        date: time.toISOString(),
                        price: Number(val.toFixed(val < 1 ? 4 : 2))
                    });
                }
                return pts;
            };

            React.useEffect(() => {
                let active = true;
                setLoading(true);
                apiCall(`/cryptocurrencies/${symbol}/chart?timeframe=${timeframe}`)
                    .then(res => {
                        if (active && res && res.prices && res.prices.length > 0) {
                            setPrices(res.prices);
                            setLoading(false);
                        } else if (active) {
                            setPrices(generateLocalData(activePrice, change24h, timeframe));
                            setLoading(false);
                        }
                    })
                    .catch(() => {
                        if (active) {
                            setPrices(generateLocalData(activePrice, change24h, timeframe));
                            setLoading(false);
                        }
                    });
                return () => { active = false; };
            }, [symbol, timeframe, activePrice, change24h]);

            const svgWidth = 780;
            const svgHeight = 280;
            const pad = { top: 20, right: 65, bottom: 35, left: 15 };

            const geom = React.useMemo(() => {
                if (!prices || prices.length < 2) return null;
                const raw = prices.map(p => p.price);
                const minP = Math.min(...raw);
                const maxP = Math.max(...raw);
                const range = maxP - minP || (maxP * 0.02) || 1;
                const paddedMin = Math.max(0, minP - range * 0.05);
                const paddedMax = maxP + range * 0.05;
                const paddedRange = paddedMax - paddedMin || 1;

                const plotW = svgWidth - pad.left - pad.right;
                const plotH = svgHeight - pad.top - pad.bottom;

                const pts = prices.map((pt, i) => ({
                    ...pt,
                    x: pad.left + (i / (prices.length - 1)) * plotW,
                    y: pad.top + (1 - (pt.price - paddedMin) / paddedRange) * plotH
                }));

                let lineD = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
                for (let i = 1; i < pts.length; i++) {
                    const prev = pts[i - 1];
                    const curr = pts[i];
                    const cpx = prev.x + (curr.x - prev.x) / 2;
                    lineD += ` C ${cpx.toFixed(1)} ${prev.y.toFixed(1)}, ${cpx.toFixed(1)} ${curr.y.toFixed(1)}, ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
                }

                const areaBottom = svgHeight - pad.bottom;
                const areaD = `${lineD} L ${pts[pts.length - 1].x.toFixed(1)} ${areaBottom} L ${pts[0].x.toFixed(1)} ${areaBottom} Z`;

                const firstP = pts[0].price;
                const lastP = pts[pts.length - 1].price;
                const isPositive = lastP >= firstP;
                const netChange = lastP - firstP;
                const netChangePct = firstP > 0 ? (netChange / firstP) * 100 : 0;

                const gridLines = [0, 0.33, 0.66, 1].map(ratio => ({
                    y: pad.top + ratio * plotH,
                    price: paddedMax - ratio * paddedRange
                }));

                const timeIndices = [0, Math.floor(pts.length * 0.25), Math.floor(pts.length * 0.5), Math.floor(pts.length * 0.75), pts.length - 1];
                const xLabels = timeIndices.map(idx => {
                    const pt = pts[idx];
                    const d = new Date(pt.timestamp);
                    let text = '';
                    if (timeframe === '1h' || timeframe === '24h') {
                        text = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } else if (timeframe === '7d' || timeframe === '1m') {
                        text = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    } else {
                        text = d.toLocaleDateString([], { month: 'short', year: '2-digit' });
                    }
                    return { x: pt.x, text };
                });

                return { pts, lineD, areaD, isPositive, netChange, netChangePct, minPrice: minP, maxPrice: maxP, firstPrice: firstP, lastPrice: lastP, gridLines, xLabels };
            }, [prices, timeframe]);

            const handleMouseMove = (e) => {
                if (!geom || !svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                const svgX = (e.clientX - rect.left) * (svgWidth / rect.width);
                let closest = 0;
                let minDiff = Infinity;
                geom.pts.forEach((pt, i) => {
                    const diff = Math.abs(pt.x - svgX);
                    if (diff < minDiff) { minDiff = diff; closest = i; }
                });
                setHoverIndex(closest);
            };

            const hoveredPoint = geom && hoverIndex !== null ? geom.pts[hoverIndex] : null;
            const isUp = geom ? geom.isPositive : true;
            const strokeColor = isUp ? '#10b981' : '#ef4444';
            const gradId = `standalone-chart-grad-${symbol}-${timeframe}`;

            return (
                <div className="crypto-chart-card card">
                    <div className="chart-header">
                        <div className="chart-title-area">
                            <div className="chart-asset-badge">
                                <span className="asset-pair">{symbol} / USD</span>
                                <span className="asset-fullname">{crypto.name || symbol}</span>
                            </div>
                            <div className="chart-price-display">
                                <span className="chart-big-price">
                                    ${fmtMoney(hoveredPoint ? hoveredPoint.price : activePrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)}
                                </span>
                                <span className={`chart-period-badge ${isUp ? 'positive' : 'negative'}`}>
                                    {hoveredPoint ? (
                                        <>
                                            {hoveredPoint.price >= geom.firstPrice ? '+' : ''}
                                            ${fmtMoney(hoveredPoint.price - geom.firstPrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)} (
                                            {geom.firstPrice > 0 ? (((hoveredPoint.price - geom.firstPrice) / geom.firstPrice) * 100).toFixed(2) : '0.00'}%)
                                        </>
                                    ) : (
                                        <>
                                            {geom && geom.netChange >= 0 ? '+' : ''}
                                            ${geom ? fmtMoney(geom.netChange, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2) : '0.00'} (
                                            {geom ? geom.netChangePct.toFixed(2) : '0.00'}%)
                                        </>
                                    )}
                                </span>
                            </div>
                        </div>

                        <div className="timeframe-bar">
                            {timeframes.map(tf => (
                                <button
                                    key={tf.value}
                                    type="button"
                                    className={`timeframe-btn ${timeframe === tf.value ? 'active' : ''}`}
                                    onClick={() => setTimeframe(tf.value)}
                                >
                                    {tf.label}
                                </button>
                            ))}
                            {onRefreshMarket && (
                                <button type="button" className="btn-icon-refresh ml-2" onClick={onRefreshMarket} title="Refresh live quotes">
                                    🔄
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="chart-canvas-container">
                        {loading && <div className="chart-loading-overlay"><span>Loading market data...</span></div>}
                        {geom ? (
                            <svg
                                ref={svgRef}
                                viewBox={`0 0 ${svgWidth} ${svgHeight}`}
                                className="crypto-svg-chart"
                                onMouseMove={handleMouseMove}
                                onMouseLeave={() => setHoverIndex(null)}
                            >
                                <defs>
                                    <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor={strokeColor} stopOpacity="0.32" />
                                        <stop offset="70%" stopColor={strokeColor} stopOpacity="0.08" />
                                        <stop offset="100%" stopColor={strokeColor} stopOpacity="0.00" />
                                    </linearGradient>
                                </defs>

                                {geom.gridLines.map((line, idx) => (
                                    <g key={idx}>
                                        <line x1={pad.left} y1={line.y} x2={svgWidth - pad.right} y2={line.y} stroke="rgba(255, 255, 255, 0.07)" strokeDasharray="4 4" />
                                        <text x={svgWidth - pad.right + 8} y={line.y + 4} fill="#8b949e" fontSize="11" fontFamily="monospace">
                                            ${fmtMoney(line.price, line.price < 1 ? 4 : 2, line.price < 1 ? 4 : 2)}
                                        </text>
                                    </g>
                                ))}

                                <path d={geom.areaD} fill={`url(#${gradId})`} />
                                <path d={geom.lineD} fill="none" stroke={strokeColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

                                {geom.xLabels.map((lbl, idx) => (
                                    <text key={idx} x={lbl.x} y={svgHeight - 10} textAnchor="middle" fill="#8b949e" fontSize="10.5">
                                        {lbl.text}
                                    </text>
                                ))}

                                {hoveredPoint && (
                                    <g>
                                        <line x1={hoveredPoint.x} y1={pad.top} x2={hoveredPoint.x} y2={svgHeight - pad.bottom} stroke="rgba(255, 255, 255, 0.4)" strokeDasharray="3 3" strokeWidth="1.2" />
                                        <circle cx={hoveredPoint.x} cy={hoveredPoint.y} r="6" fill={strokeColor} stroke="#0d1117" strokeWidth="2.5" />
                                    </g>
                                )}
                            </svg>
                        ) : (
                            <div className="chart-empty">No chart data available for this timeframe.</div>
                        )}

                        {hoveredPoint && (
                            <div
                                className="chart-floating-hud"
                                style={{
                                    left: `${(hoveredPoint.x / svgWidth) * 100}%`,
                                    top: `${Math.max(10, (hoveredPoint.y / svgHeight) * 100 - 20)}%`
                                }}
                            >
                                <div className="hud-time">{new Date(hoveredPoint.timestamp).toLocaleString()}</div>
                                <div className="hud-price">${fmtMoney(hoveredPoint.price, hoveredPoint.price < 1 ? 4 : 2, hoveredPoint.price < 1 ? 4 : 2)}</div>
                            </div>
                        )}
                    </div>

                    {geom && (
                        <div className="chart-stats-strip">
                            <div className="stat-pill">
                                <span className="stat-label">Period Open:</span>
                                <span className="stat-val">${fmtMoney(geom.firstPrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)}</span>
                            </div>
                            <div className="stat-pill">
                                <span className="stat-label">Period High:</span>
                                <span className="stat-val text-success">${fmtMoney(geom.maxPrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)}</span>
                            </div>
                            <div className="stat-pill">
                                <span className="stat-label">Period Low:</span>
                                <span className="stat-val text-danger">${fmtMoney(geom.minPrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)}</span>
                            </div>
                            <div className="stat-pill">
                                <span className="stat-label">Volatility Range:</span>
                                <span className="stat-val">${fmtMoney(geom.maxPrice - geom.minPrice, activePrice < 1 ? 4 : 2, activePrice < 1 ? 4 : 2)}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function TradingView({ cryptos = [], portfolio, onRefresh, selectedSymbol: incomingSymbol, onSelectSymbol, lastUpdated, isRefreshing, countdown = REFRESH_INTERVAL_SECONDS, backendOffline, onRefreshMarket }) {
            const [symbol, setSymbol] = React.useState(incomingSymbol || 'BTC');
            const [side, setSide] = React.useState('BUY');
            const [orderType, setOrderType] = React.useState('MARKET');
            const [quantity, setQuantity] = React.useState('');
            const [limitPrice, setLimitPrice] = React.useState('');
            const [msg, setMsg] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            React.useEffect(() => {
                if (incomingSymbol && incomingSymbol !== symbol) {
                    setSymbol(incomingSymbol);
                }
            }, [incomingSymbol]);

            const handleSymbolChange = (newSym) => {
                setSymbol(newSym);
                if (onSelectSymbol) {
                    onSelectSymbol(newSym);
                }
            };

            const coin = cryptos.find(c => c.symbol === symbol) || cryptos[0] || {};
            const livePrice = Number(coin.currentPrice || 0);
            const pSummary = portfolio?.summary || portfolio || {};
            const holding = portfolio?.holdings?.find(h => h.symbol === symbol);
            const availQty = safeNum(holding?.quantity);
            const cash = safeNum(pSummary.cashBalance ?? portfolio?.cashBalance);
            const avgBuyPrice = safeNum(holding?.averageCost ?? holding?.averageBuyPrice);

            const execPrice = orderType === 'LIMIT' && limitPrice ? safeNum(limitPrice) : livePrice;
            const totalCost = safeNum((safeNum(quantity) || 0) * execPrice);

            React.useEffect(() => {
                if (orderType === 'LIMIT' && livePrice > 0 && !limitPrice) {
                    setLimitPrice(livePrice.toFixed(livePrice < 1 ? 4 : 2));
                }
            }, [symbol, orderType, livePrice]);

            const quickFill = (pct) => {
                if (side === 'BUY') {
                    if (execPrice <= 0 || isNaN(execPrice)) return;
                    const q = ((cash * pct) / execPrice).toFixed(6);
                    setQuantity(isNaN(Number(q)) ? '0.00' : q);
                } else {
                    const q = (availQty * pct).toFixed(6);
                    setQuantity(isNaN(Number(q)) ? '0.00' : q);
                }
            };

            const submit = async (e) => {
                e.preventDefault();
                setMsg(null);
                const q = parseFloat(quantity);
                if (!q || q <= 0 || isNaN(q)) {
                    setMsg({ type: 'error', text: 'Enter a valid positive quantity.' });
                    return;
                }
                if (side === 'BUY' && totalCost > cash) {
                    setMsg({ type: 'error', text: `Insufficient cash. Need $${fmtMoney(totalCost)}, have $${fmtMoney(cash)}.` });
                    return;
                }
                if (side === 'SELL' && q > availQty) {
                    setMsg({ type: 'error', text: `Insufficient ${symbol} quantity. Need ${q}, have ${availQty}.` });
                    return;
                }

                setLoading(true);
                try {
                    const res = await apiCall('/orders', 'POST', {
                        symbol,
                        side,
                        orderType,
                        quantity: q,
                        price: orderType === 'LIMIT' ? parseFloat(limitPrice) : null
                    });
                    const execP = safeNum(res?.executedPrice ?? res?.executionPrice ?? res?.price ?? livePrice);
                    const st = res?.status || 'FILLED';
                    setMsg({ type: 'success', text: `Successfully placed ${side} order for ${q} ${symbol}! (Status: ${st} @ $${fmtMoney(execP, execP < 1 ? 4 : 2)})` });
                    setMsg({ type: 'success', text: `Successfully placed ${side} order for ${q} ${symbol}! (Status: ${st} @ $${fmtMoney(execP, execP < 1 ? 4 : 2, execP < 1 ? 6 : 2)})` });
                    setQuantity('');
                    if (onRefresh) onRefresh();

                    setLoading(false);

                            <div className="card order-card">

                                    <h4>Order Ticket: {symbol}</h4>
                                    <div className="order-side-toggle">

            const [reportTimeframe, setReportTimeframe] = React.useState('30d');

            const [feedback, setFeedback] = React.useState(null);

            const handleDownloadReport = async () => {
                setIsDownloadingReport(true);
                setFeedback(null);
                try {
                    await downloadPnLReport(reportTimeframe);
                    setFeedback({
                        type: 'success',
                        message: `PnL & Settlement statement for ${reportTimeframe.toUpperCase()} downloaded successfully.`
                    });
                } catch (err) {
                    setFeedback({
                        type: 'error',
                        message: err.message || 'Failed to download report. Ensure backend server is running.'
                    });

                    setIsDownloadingReport(false);
                }
            };

            const confirmClosePosition = async () => {
                if (!closingHolding) return;
                setIsClosing(true);
                try {
                    const result = await apiCall(`/portfolio/positions/${closingHolding.symbol}/close`, 'POST');
                    setFeedback({
                        type: 'success',
                        message: `Successfully closed entire position of ${closingHolding.quantity} ${closingHolding.symbol} at $${fmtMoney(result?.executionPrice || closingHolding.currentPrice)}!`
                    });
                    setClosingHolding(null);
                    if (onRefresh) await onRefresh();
                } catch (err) {
                    setFeedback({
                        type: 'error',
                        message: err.message || `Failed to close position for ${closingHolding.symbol}.`
                    });

                    setIsClosing(false);

            return (
                <div className="portfolio-view">

                            <span>{feedback.type === 'success' ? '✅' : '⚠️'} {feedback.message}</span>

                        </div>

                                <label style={{ fontSize: '0.85rem', color: '#94a3b8', margin: 0 }}>Period:</label>
                                <select
                                    className="form-control form-control-sm"
                                    style={{ background: '#0d1117', color: '#f0f6fc', border: '1px solid #30363d', padding: '0.35rem 0.6rem', borderRadius: '6px', minWidth: '140px' }}

                                    <option value="all">All Time History</option>
                                </select>

                            <button
                                className="btn btn-sm btn-primary"
                                onClick={handleDownloadReport}
                                disabled={isDownloadingReport}
                                style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontWeight: 600, padding: '0.4rem 0.85rem' }}

                                {isDownloadingReport ? '⏳ Generating PDF...' : '📥 Download PDF Statement'}
                            </button>

                    <div className="metrics-grid">

                        <div className="metric-card">
                            <div className="metric-label">Cash</div>
                            <div className="metric-value">${fmtMoney(cash)}</div>
                        </div>

                            <div className="metric-label">Holdings Value</div>
                            <div className="metric-value">${fmtMoney(cryptoVal)}</div>

                    <div className="card mt-4">
                        <div className="card-header"><h4>Detailed Holdings ({holdings.length})</h4></div>

                                    <tr><th>Symbol</th><th>Quantity</th><th>Avg Buy Price</th><th>Current Price</th><th>Market Value</th><th>Unrealized P/L</th><th>Action</th></tr>

                                </thead>

                                                            <button className="btn btn-sm btn-outline" onClick={() => onTradeCrypto ? onTradeCrypto(h.symbol) : setActiveTab('trading')}>Trade</button>
                                                            <button

                                                                    color: '#f87171',
                                                                    border: '1px solid rgba(239, 68, 68, 0.3)',
                                                                    cursor: 'pointer'
                                                                }}
                                                                onClick={() => { setFeedback(null); setClosingHolding(h); }}
                                                                title={`Close entire position of ${qty} ${h.symbol}`}

                                                                Close Position
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>

                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                                        <span className="text-muted">Quantity to Liquidate:</span>
                                        <strong>{closingHolding.quantity} {closingHolding.symbol}</strong>
                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>

                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                                        <span className="text-muted">Estimated Cash Proceeds:</span>
                                        <strong style={{ color: '#58a6ff' }}>${fmtMoney(closingHolding.currentValue ?? (closingHolding.quantity * closingHolding.currentPrice))}</strong>

        function OrdersView({ onRefresh }) {
            const [orders, setOrders] = React.useState([]);
            const [status, setStatus] = React.useState('');
            const [loading, setLoading] = React.useState(true);
            const [msg, setMsg] = React.useState(null);

            const load = async () => {
                setLoading(true);
                try {
                    const res = await apiCall(`/orders${status ? '?status=' + status : ''}`);
                    setOrders(res || []);
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => { load(); }, [status]);

            const cancel = async (id) => {
                try {
                    await apiCall(`/orders/${id}`, 'DELETE');
                    setMsg({ type: 'success', text: `Order #${id} cancelled.` });
                    load();
                    onRefresh();
                } catch (e) {
                    setMsg({ type: 'error', text: e.message });
                }
            };

            return (
                <div className="orders-view">
                    <div className="section-header">
                        <h3>Order History</h3>
                        <div className="filter-group">
                            {['', 'PENDING', 'FILLED', 'CANCELLED'].map(s => (
                                <button key={s} className={`filter-btn ${status === s ? 'active' : ''}`} onClick={() => setStatus(s)}>
                                    {s || 'ALL'}
                                </button>
                            ))}
                        </div>
                    </div>
                    {msg && <div className={`alert ${msg.type === 'success' ? 'alert-success' : 'alert-error'}`}>{msg.text}</div>}

                                                <td><span className={`badge ${o.side === 'BUY' ? 'badge-buy' : 'badge-sell'}`}>{o.side}</span></td>
                                                <td>{o.orderType}</td>
                                                <td>{safeNum(o.quantity).toFixed(8)}</td>
                                                <td>{o.price ? `$${fmtMoney(o.price)}` : 'MARKET'}</td>

            const [loading, setLoading] = React.useState(true);

                apiCall('/trades').then(d => setTrades(d || [])).catch(console.error).finally(() => setLoading(false));

                <div className="trades-view">
                    <div className="section-header"><h3>Executed Trades</h3></div>
                    <div className="card">
                        <div className="table-responsive">
                            <table className="table">
                                <thead>
                                    <tr><th>Trade ID</th><th>Order</th><th>Date</th><th>Symbol</th><th>Side</th><th>Quantity</th><th>Price</th><th>Total</th><th>Realized P/L</th></tr>
                                </thead>
                                <tbody>
                                    {loading ? (
                                        <tr><td colSpan="9" className="text-center py-4">Loading trades...</td></tr>
                                    ) : trades.length === 0 ? (
                                        <tr><td colSpan="9" className="text-center text-muted py-4">No trades executed yet.</td></tr>
                                    ) : (
                                        trades.map(t => (
                                            <tr key={t.tradeId}>
                                                <td>#{t.tradeId}</td>
                                                <td>#{t.orderId}</td>
                                                <td>{new Date(t.executedDate).toLocaleString()}</td>
                                                <td><strong>{t.symbol}</strong></td>
                                                <td><span className={`badge ${t.side === 'BUY' ? 'badge-buy' : 'badge-sell'}`}>{t.side}</span></td>
                                                <td>{safeNum(t.quantity).toFixed(8)}</td>
                                                <td>${fmtMoney(t.price)}</td>
                                                <td><strong>${fmtMoney(t.totalAmount)}</strong></td>
                                                <td className={safeNum(t.realizedPnL) >= 0 ? 'text-success' : 'text-danger'}>
                                                    {t.side === 'SELL' ? `$${fmtMoney(t.realizedPnL)}` : '—'}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function LedgerView() {
            const [txs, setTxs] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                apiCall('/transactions').then(d => setTxs(d || [])).catch(console.error).finally(() => setLoading(false));
            }, []);

            return (
                <div className="ledger-view">
                    <div className="section-header"><h3>Financial Transaction Ledger</h3></div>
                    <div className="card">
                        <div className="table-responsive">
                            <table className="table">
                                <thead>
                                    <tr><th>Tx ID</th><th>Date</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th></tr>
                                </thead>
                                <tbody>
                                    {loading ? (
                                        <tr><td colSpan="6" className="text-center py-4">Loading ledger...</td></tr>
                                    ) : txs.length === 0 ? (
                                        <tr><td colSpan="6" className="text-center text-muted py-4">No transactions recorded.</td></tr>
                                    ) : (
                                        txs.map(t => (
                                            <tr key={t.transactionId}>
                                                <td>#{t.transactionId}</td>
                                                <td>{new Date(t.createdDate).toLocaleString()}</td>
                                                <td><span className={`badge ${t.transactionType === 'DEPOSIT' ? 'badge-success' : t.transactionType === 'WITHDRAWAL' ? 'badge-warning' : 'badge-secondary'}`}>{t.transactionType}</span></td>
                                                <td><strong>${fmtMoney(t.amount)}</strong></td>
                                                <td><strong>{t.balanceAfter !== undefined && t.balanceAfter !== null ? `$${fmtMoney(t.balanceAfter)}` : '—'}</strong></td>
                                                <td className="text-muted">{t.description || `${t.transactionType} ref #${t.referenceId || t.status || ''}`}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function FundsView({ portfolio, onRefresh }) {
            const [depAmt, setDepAmt] = React.useState('1000');
            const [withAmt, setWithAmt] = React.useState('500');
            const [msg, setMsg] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const pSummary = portfolio?.summary || portfolio || {};
            const cash = safeNum(pSummary.cashBalance ?? portfolio?.cashBalance);

            const handleDep = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMsg(null);
                try {
                    const res = await apiCall('/deposits', 'POST', { amount: parseFloat(depAmt), currency: 'USD' });
                    setMsg({ type: 'success', text: `Deposited $${depAmt}! New Balance: $${Number(res.newBalance).toFixed(2)}` });
                    onRefresh();
                } catch (ex) {
                    setMsg({ type: 'error', text: ex.message });
                } finally {
                    setLoading(false);
                }
            };

            const handleWith = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMsg(null);
                try {
                    const res = await apiCall('/withdrawals', 'POST', { amount: parseFloat(withAmt), currency: 'USD' });
                    const bal = (res?.newBalance !== undefined && res?.newBalance !== null && !(res?.newBalance === 0 && res?.remainingBalance > 0))
                        ? res.newBalance
                        : (res?.remainingBalance ?? Math.max(0, cash - parseFloat(withAmt)));
                    setMsg({ type: 'success', text: `Withdrew $${parseFloat(withAmt).toFixed(2)}! New Balance: $${Number(bal).toFixed(2)}` });
                    onRefresh();
                } catch (ex) {
                    setMsg({ type: 'error', text: ex.message });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="funds-view">
                    <div className="section-header"><h3>Funds Simulation</h3></div>
                    {msg && <div className={`alert ${msg.type === 'success' ? 'alert-success' : 'alert-error'}`}>{msg.text}</div>}
                    <div className="funds-grid">
                        <div className="card p-3">
                            <h4>Deposit Cash</h4>
                            <form onSubmit={handleDep} className="mt-3">
                                <div className="form-group">
                                    <label>Amount (USD)</label>
                                    <input type="number" step="any" value={depAmt} onChange={e => setDepAmt(e.target.value)} required />
                                </div>
                                <button type="submit" className="btn btn-primary btn-block" disabled={loading}>Deposit</button>
                            </form>
                        </div>
                        <div className="card p-3">
                            <h4>Withdraw Cash</h4>
                            <form onSubmit={handleWith} className="mt-3">
                                <div className="form-group">
                                    <label>Amount (USD) — Avail: ${fmtMoney(cash)}</label>
                                    <input type="number" step="any" value={withAmt} onChange={e => setWithAmt(e.target.value)} required />
                                </div>
                                <button type="submit" className="btn btn-warning btn-block" disabled={loading}>Withdraw</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function ProfileView({ user, onUpdate }) {
            const [data, setData] = React.useState(null);
            const [firstName, setFirstName] = React.useState(user?.firstName || '');
            const [lastName, setLastName] = React.useState(user?.lastName || '');
            const [email, setEmail] = React.useState(user?.email || '');
            const [msg, setMsg] = React.useState(null);

            React.useEffect(() => {
                apiCall('/profile').then(d => {
                    const prof = d?.data || d;
                    setData(prof);
                    const u = prof?.user || prof || {};
                    setFirstName(u.firstName || user?.firstName || '');
                    setLastName(u.lastName || user?.lastName || '');
                    setEmail(u.email || user?.email || '');
                }).catch(console.error);
            }, [user]);

            const save = async (e) => {
                e.preventDefault();
                try {
                    const res = await apiCall('/profile', 'PUT', { firstName, lastName, email });
                    const updated = res?.data || res;
                    setData(prev => ({
                        ...prev,
                        ...updated,
                        firstName,
                        lastName,
                        email,
                        user: {
                            ...(prev?.user || {}),
                            ...(updated?.user || {}),
                            firstName,
                            lastName,
                            email
                        }
                    }));
                    setMsg({ type: 'success', text: 'Profile updated successfully!' });
                    if (onUpdate) onUpdate(updated);
                } catch (ex) {
                    setMsg({ type: 'error', text: ex.message || 'Failed to update profile.' });
                }
            };

            const u = data?.user || data || user || {};
            const acc = data?.account || data || {};
            const balance = acc.balance ?? data?.cashBalance ?? user?.cashBalance ?? 0;

            return (
                <div className="profile-view">
                    <div className="section-header"><h3>Account Profile</h3></div>
                    {msg && <div className={`alert ${msg.type === 'error' ? 'alert-error' : 'alert-success'}`}>{msg.text}</div>}
                    <div className="profile-grid">
                        <div className="card p-3">
                            <h4>Details</h4>
                            <div className="detail-item"><span>User ID:</span><strong>#{u.userId || user?.userId || '-'}</strong></div>
                            <div className="detail-item"><span>Username:</span><strong>{u.username || user?.username || '-'}</strong></div>
                            <div className="detail-item"><span>Account ID:</span><strong>#{acc.accountId || data?.accountId || u.userId || '-'}</strong></div>
                            <div className="detail-item"><span>Cash Balance:</span><strong className="text-success">${formatMoney(balance)} {acc.currency || data?.currency || 'USD'}</strong></div>
                            <div className="detail-item"><span>Member Since:</span><span>{u.createdDate ? new Date(u.createdDate).toLocaleDateString() : (user?.createdDate ? new Date(user.createdDate).toLocaleDateString() : 'N/A')}</span></div>
                            <div className="detail-item"><span>Last Login:</span><span>{u.lastLoginDate ? new Date(u.lastLoginDate).toLocaleString() : 'First session'}</span></div>
                        </div>
                        <div className="card p-3">
                            <h4>Edit Profile</h4>
                            <form onSubmit={save}>
                                <div className="form-group"><label>First Name</label><input value={firstName} onChange={e => setFirstName(e.target.value)} placeholder="Enter first name" required /></div>
                                <div className="form-group"><label>Last Name</label><input value={lastName} onChange={e => setLastName(e.target.value)} placeholder="Enter last name" required /></div>
                                <div className="form-group"><label>Email</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Enter email address" required /></div>
                                <button type="submit" className="btn btn-primary btn-block">Save Changes</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
